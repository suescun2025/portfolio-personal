<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Filtros de resplandor neón -->
    <filter id="neon-glow-cyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur2"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="15" result="blur3"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="30" result="blur4"/>
      <feMerge>
        <feMergeNode in="blur4"/>
        <feMergeNode in="blur3"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="neon-glow-yellow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur2"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="blur3"/>
      <feMerge>
        <feMergeNode in="blur3"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <radialGradient id="spark-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .neon-cyan {
      fill: none;
      stroke: #00f3ff;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: url(#neon-glow-cyan);
    }
    .neon-cyan-core {
      fill: none;
      stroke: #e0ffff;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .neon-yellow {
      fill: none;
      stroke: #ffb800;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: url(#neon-glow-yellow);
    }
    .neon-yellow-core {
      fill: none;
      stroke: #fffbe6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .sparkle-dot {
      fill: #ffffff;
      filter: drop-shadow(0 0 4px #00f3ff) drop-shadow(0 0 8px #38bdf8);
    }
  </style>

  <g transform="translate(0, 5)">
    <!-- 1. RAYOS Y DESTELLOS AMARILLOS / DORADOS -->
    <g class="neon-yellow" stroke-width="4.5">
      <!-- Rayo superior central -->
      <line x1="250" y1="40" x2="250" y2="85" />
      <!-- Rayos lado derecho -->
      <line x1="335" y1="75" x2="368" y2="100" />
      <line x1="380" y1="180" x2="435" y2="205" />
      <line x1="355" y1="285" x2="395" y2="325" />
      <!-- Rayos lado izquierdo -->
      <line x1="165" y1="75" x2="132" y2="100" />
      <line x1="120" y1="180" x2="65" y2="205" />
      <line x1="145" y1="285" x2="105" y2="325" />
      <!-- Destellos pequeños / Rayitos tipo relámpago -->
      <path d="M 195 65 L 205 60 L 200 75 L 212 70" stroke-width="3" />
      <path d="M 305 65 L 295 60 L 300 75 L 288 70" stroke-width="3" />
      <path d="M 130 235 L 140 230 L 135 245" stroke-width="3" />
      <path d="M 370 235 L 360 230 L 365 245" stroke-width="3" />
    </g>

    <g class="neon-yellow-core" stroke-width="2">
      <line x1="250" y1="40" x2="250" y2="85" />
      <line x1="335" y1="75" x2="368" y2="100" />
      <line x1="380" y1="180" x2="435" y2="205" />
      <line x1="355" y1="285" x2="395" y2="325" />
      <line x1="165" y1="75" x2="132" y2="100" />
      <line x1="120" y1="180" x2="65" y2="205" />
      <line x1="145" y1="285" x2="105" y2="325" />
    </g>

    <!-- 2. ESTRUCTURA PRINCIPAL DEL BOMBILLO Y CEREBRO (NEÓN CIAN) -->
    <g class="neon-cyan" stroke-width="6.5">
      <!-- Eje vertical central -->
      <line x1="250" y1="95" x2="250" y2="340" />

      <!-- LADO DERECHO: Contorno de bombillo clásico -->
      <path d="M 250 95 
               C 335 95, 365 160, 365 210 
               C 365 265, 320 295, 305 320 
               L 305 345 
               L 250 345" />

      <!-- Filamentos interiores del lado derecho del bombillo -->
      <line x1="275" y1="340" x2="275" y2="210" />
      <path d="M 275 210 
               C 275 190, 305 185, 305 205 
               C 305 225, 275 220, 275 200" />
      <line x1="290" y1="340" x2="290" y2="250" />

      <!-- LADO IZQUIERDO: Lóbulos exteriores del cerebro -->
      <path d="M 250 95 
               C 225 90, 205 105, 200 120 
               C 185 115, 160 130, 160 155 
               C 145 160, 135 180, 135 205 
               C 135 235, 150 255, 165 265 
               C 155 280, 165 305, 185 315 
               C 185 330, 200 345, 250 345" />

      <!-- Giros / Circunvoluciones internas del cerebro -->
      <path d="M 200 140 C 220 145, 230 170, 215 190 C 200 205, 180 195, 175 215 C 170 235, 195 250, 210 240" />
      <path d="M 235 125 C 240 145, 240 165, 245 185" />
      <path d="M 180 165 C 195 175, 210 165, 215 150" />
      <path d="M 195 270 C 215 265, 235 280, 230 300 C 225 315, 205 325, 220 340" />
      <path d="M 160 230 C 180 235, 190 220, 185 200" />

      <!-- BASE DEL BOMBILLO (Roscas metálicas en neón cian) -->
      <!-- Rosca 1 -->
      <path d="M 195 365 C 220 378, 280 378, 305 365" />
      <!-- Rosca 2 -->
      <path d="M 208 388 C 228 398, 272 398, 292 388" />
      <!-- Rosca 3 (inferior) -->
      <path d="M 225 410 C 238 418, 262 418, 275 410" />
    </g>

    <!-- Núcleo blanco brillante de las líneas neón para máxima luminosidad -->
    <g class="neon-cyan-core" stroke-width="2.5">
      <line x1="250" y1="95" x2="250" y2="340" />
      <path d="M 250 95 
               C 335 95, 365 160, 365 210 
               C 365 265, 320 295, 305 320 
               L 305 345 
               L 250 345" />
      <line x1="275" y1="340" x2="275" y2="210" />
      <path d="M 275 210 
               C 275 190, 305 185, 305 205 
               C 305 225, 275 220, 275 200" />
      <line x1="290" y1="340" x2="290" y2="250" />
      <path d="M 250 95 
               C 225 90, 205 105, 200 120 
               C 185 115, 160 130, 160 155 
               C 145 160, 135 180, 135 205 
               C 135 235, 150 255, 165 265 
               C 155 280, 165 305, 185 315 
               C 185 330, 200 345, 250 345" />
      <path d="M 200 140 C 220 145, 230 170, 215 190 C 200 205, 180 195, 175 215 C 170 235, 195 250, 210 240" />
      <path d="M 235 125 C 240 145, 240 165, 245 185" />
      <path d="M 180 165 C 195 175, 210 165, 215 150" />
      <path d="M 195 270 C 215 265, 235 280, 230 300 C 225 315, 205 325, 220 340" />
      <path d="M 160 230 C 180 235, 190 220, 185 200" />
      <path d="M 195 365 C 220 378, 280 378, 305 365" />
      <path d="M 208 388 C 228 398, 272 398, 292 388" />
      <path d="M 225 410 C 238 418, 262 418, 275 410" />
    </g>

    <!-- PUNTOS DE DESTELLO Y POLVO DE ESTRELLAS -->
    <circle cx="215" cy="190" r="3.5" class="sparkle-dot" />
    <circle cx="275" cy="210" r="4" class="sparkle-dot" />
    <circle cx="250" cy="150" r="3" class="sparkle-dot" />
    <circle cx="170" cy="270" r="2.5" class="sparkle-dot" />
    <circle cx="340" cy="150" r="3" class="sparkle-dot" />
    <circle cx="300" cy="280" r="3" class="sparkle-dot" />
    <circle cx="250" cy="310" r="3" class="sparkle-dot" />
    <circle cx="380" cy="120" r="2.5" class="sparkle-dot" />
    <circle cx="110" cy="130" r="2.5" class="sparkle-dot" />
    <circle cx="360" cy="355" r="2.5" class="sparkle-dot" />
    <circle cx="140" cy="355" r="2.5" class="sparkle-dot" />
  </g>
</svg>
